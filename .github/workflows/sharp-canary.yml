name: Sharp Security Canary

on:
  push:
    branches:
      - agenttube-analyst
    paths:
      - .github/workflows/sharp-canary.yml

permissions:
  contents: write

jobs:
  canary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agenttube-analyst
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade sharp canary
        run: npm install sharp@^0.35.4 --save

      - name: Lint
        run: npm run lint

      - name: Analyst tests
        run: npm run test:analyst

      - name: Upstream AgentTube tests
        run: npm test

      - name: High severity runtime audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit sharp upgrade
        shell: bash
        run: |
          rm -f .github/workflows/sharp-canary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/sharp-canary.yml
          git commit -m "chore: upgrade sharp after security canary"
          git push origin HEAD:agenttube-analyst
